<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Book borrowing system for library">
    <meta name="author" content="Jhonny Sumulong">

    <title>BookHub - Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Boxicons for icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="main.css">

</head>

<body>

    <div class="container-fluid d-flex justify-content-center align-items-center vh-100" style="margin-top: 30px; margin-bottom: 30px;">

        <div class="row w-100">
            <div class="col-md-4"></div>

            <div class="col-md-4">
                <div class="panel-primary text-center" id="login">
                    <div class="system">
                        <p>Book Borrowing System</p>
                   </div>
           
                   <div class="system-logo">
                     <img src="bookLogo.png" style="width:130px;height:130px;display: block;margin: 0 auto;border: 0 px solid;border-radius: 100%; object-fit: cover;" class="img-circle img-responsive mb-2 mt-2" alt="systemLogo">
                   </div>

                    <form id="formLogin" method="post">
                        <div class="panel-body">
                            <div class="admin-msg"></div>
                            <h1 class="panel-title">Sign In</h1>

                            <div class="reg-form"></div>

                            <div class="row">
                                <div class="col-md-12">
                                    <div class="input-group mt-4 mb-3">
                                        <span class="input-group-text"><i class='bx bxs-user'></i></span>
                                        <input type="text" name="username" id="username" placeholder="Enter Username" required class="form-control" data-validation-error-msg="Username is required" data-validation-error-msg-container="#usernameerror">
                                    </div>
                                    <div id="usernameerror"> </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12">
                                    <div class="input-group mb-4">
                                        <span class="input-group-text"><i class='bx bxs-lock-alt'></i></span>
                                        <input type="password" name="password" id="password" placeholder="Enter Password" required="required" class="form-control" data-validation-error-msg="Atleast 8 characters is required" data-validation-error-msg-container="#passworderror">
                                    </div>
                                    <div id="passworderror"></div>
                                </div>
                            </div>

                            <!-- for checking and forget password -->
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" id="rememberMe">
                                            <label class="remember small">Remember me</label>
                                        </div>
                                        <a href="#" class="forget-pass">Forget Password?</a>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12">
                                    <div class="d-grid mb-4">
                                        <input type="hidden" name="action" value="isLogin">
                                        <button type="submit" class="btn btn-primary w-100" id="btnLogin">Log In</button>
                                    </div>
                                </div>
                            </div>

                            <!-- if may account na naka naka lagay sa href ung link ng sign up of registration -->
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="text-center small">
                                        Don't have an account? <a href="https://kiminoyawa.github.io/BookHubRegistration/">Sign Up</a>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</body>

</html>
